name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The Android SDK is preinstalled on GitHub's Ubuntu runners.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core logic)
        run: ./gradlew :core:test
      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug --console=plain 2>&1 | tee build.log; then
            # Surface compiler errors as annotations, readable without downloading the full log.
            grep -E '^e: ' build.log | head -10 | while IFS= read -r line; do echo "::error title=Kotlin::${line}"; done
            summary=$(grep -E '^e: |^> |What went wrong|error:' build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${summary}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clipboost-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
